version: "3.9"

services:
  xhs-api:
    image: joeanamier/xhs-downloader
    container_name: xhs-api
    ports:
      - "13001:5556"
    volumes:
      - /volume2/docker/xhs-downloader/volumes:/app/Volume
      - /volume2/se-p/小红书:/xhs
    tty: true
    stdin_open: true
    command: python main.py api
    restart: unless-stopped

  nas-auto-download:
    image: ghcr.io/ccawmiku/nas-auto-download-integrated:v1.1.4
    container_name: nas-auto-download
    depends_on:
      - xhs-api
    ports:
      - "14001:14001"
    volumes:
      - /volume2/docker/xhs-downloader/volumes:/xhs-volume
      - /volume2/docker/xhs-downloader/auto/config:/config/xhs
      - /volume2/docker/xhs-downloader/auto/queue:/queue/xhs
      - /volume2/docker/xhs-downloader/auto/state:/state/xhs
      - /volume2/docker/x-auto-download/config:/config/x
      - /volume2/docker/x-auto-download/state:/state/x
      - /volume2/docker/x-auto-download/downloads-metadata:/downloads/x/downloads-metadata
      - /volume2/se-p/x-p:/downloads/x/images
      - /volume1/se-v/x-v:/downloads/x/videos
      - /volume2/docker/pixiv-auto-download/config:/config/pixiv
      - /volume2/docker/pixiv-auto-download/state:/state/pixiv
      - /volume2/se-p/pixiv:/downloads/pixiv
    restart: unless-stopped
